[workspace]
resolver = "2"
members = [
    "kiwi-autoconfig",
    "kiwi-contacts",
    "kiwi-core",
    "kiwi-forensics",
    "kiwi-mail",
    "kiwi-mailauth",
    "kiwi-sandbox",
    "kiwi-app/src-tauri",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"

# Security-sensitive parsing of untrusted input across the workspace.
[workspace.lints.rust]
unsafe_code = "forbid"
