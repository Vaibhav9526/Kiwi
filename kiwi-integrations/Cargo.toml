[package]
name = "kiwi-integrations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI external-service integrations behind provider traits: disposable inboxes (TempMailProvider; GuerrillaMail impl) and deliverability testing (DeliverabilityTester; email-spam-tester impl). HTTPS-only via reqwest+rustls; sessions in memory only; no credential persistence; tests run on recorded fixtures, never live."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
zeroize.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[lints]
workspace = true
