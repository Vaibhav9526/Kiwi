[package]
name = "kiwi-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI desktop client (Tauri shell)"
publish = false

[lib]
name = "kiwi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiwi-mail = { path = "../../kiwi-mail" }
kiwi-core = { path = "../../kiwi-core" }
kiwi-forensics = { path = "../../kiwi-forensics" }
kiwi-contacts = { path = "../../kiwi-contacts" }
kiwi-integrations = { path = "../../kiwi-integrations" }
kiwi-sandbox = { path = "../../kiwi-sandbox" }
kiwi-autoconfig = { path = "../../kiwi-autoconfig" }
# DNS MX lookups for autoconfig discovery (same pin kiwi-mailauth uses).
hickory-resolver = { version = "0.26", features = ["tokio"] }
async-trait.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
base64.workspace = true
zeroize.workspace = true
sha2.workspace = true
getrandom.workspace = true
x509-parser = "0.17"
# OS credential store (Windows Credential Manager / macOS Keychain /
# Secret Service) — the live binding for kiwi_mail::account::CredentialStore.
keyring = "3.6"
# Challenge-response signature verification for authenticator-bound unlock
# (contracts/security-session.md §6).
ed25519-dalek = "2"
# HTML sanitization for the rendered message view (strict allowlist —
# scripts, remote resources, and forms never reach the webview).
ammonia = "4"
# Same mail-parser version kiwi-mail uses — attachment byte extraction for
# the download command reads the stored MIME directly.
mail-parser.workspace = true
url = "2"

# Test-only: scripted transcript-replay seam (loopback E2E, T-257).
[dev-dependencies]
kiwi-mail = { path = "../../kiwi-mail", features = ["e2e-fixtures"] }

[lints]
workspace = true
