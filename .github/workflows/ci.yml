# KIWI CI (T-140 Agent 6; T-177: infra/e2e both suites + mobile lint;
# T-336 Agent 26: CDP ui-smoke job).
# Mirrors the local gates in docs/TESTING.md §2:
# Rust workspace (test/clippy/fmt) + kiwi-admin (ci/typecheck/test) +
# mobile (ci/lint) + kiwi-app (typecheck/test/build + CDP ui-smoke) +
# static checks (secret scan, fixtures, CSP, encoding, compose-static) +
# live infra (compose db+mailpit+greenmail+admin, full unittest suites
# incl. infra/e2e admin + mail-flow).
#
# What CI does NOT do: build Tauri bundles, run the Tauri desktop shell
# itself, touch the sandbox (T-132), or require AI availability. The
# ui-smoke job runs the same renderer in a plain headless browser against
# the app's demo mode — that is a browser smoke gate, not a Tauri E2E.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # System deps for compiling the Tauri workspace member (kiwi-app).
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  node-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwi-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  node-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  node-kiwi-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwi-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # T-336 (Agent 26): CDP UI smoke suite against the real rendered DOM.
  # The harness boots its own vite server and drives a real headless
  # Chrome/Chromium over the DevTools protocol (no mocks, no jsdom).
  # The browser is PROBED first — the ubuntu-latest image ships Google
  # Chrome — and only installed (Playwright Chromium) when the probe finds
  # nothing, so a green run always means a real browser actually ran.
  # KIWI_SMOKE_REQUIRE_BROWSER=1 makes a missing browser a hard FAIL rather
  # than an honest skip, so this job can never go green without running.
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kiwi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwi-app/package-lock.json
      - name: Resolve a headless browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$bin" >/dev/null 2>&1; then
              found="$(command -v "$bin")"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "No system Chrome/Chromium; installing Playwright Chromium."
            npx --yes playwright@1 install --with-deps chromium
            found="$(ls -1 "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$found" ] || [ ! -x "$found" ]; then
            {
              echo "### ui-smoke: no headless browser available"
              echo
              echo "This gate is required, so the job fails instead of reporting a skip as a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          version="$("$found" --version 2>/dev/null || echo unknown)"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "path=$found" >> "$GITHUB_OUTPUT"
          {
            echo "### ui-smoke browser"
            echo
            echo '```'
            echo "$found - $version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run build
      - name: UI smoke (CDP)
        env:
          KIWI_SMOKE_BROWSER: ${{ steps.browser.outputs.path }}
          KIWI_SMOKE_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          npm run test:ui 2>&1 | tee smoke.log
      - name: Upload ui-smoke output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: kiwi-app/smoke.log
          if-no-files-found: warn
          retention-days: 7

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - run: python tests/tools/secret_scan.py
      # Copy-overlap gate (T-198, Agent 21). CHECK A (Mailspring/MailFlow
      # provenance markers) always runs. CHECK B (>=45-char verbatim overlap)
      # needs the reference/ checkouts, which are gitignored by design; mount
      # them and set KIWI_COPY_REF_DIR to enable B. This is the gate that
      # protects T-190/T-191 (Mailspring-faithful rebuild).
      - run: python tests/tools/copy_overlap.py
      - run: python tests/tools/check_fixtures.py
      - run: python tests/tools/check_csp.py
      - run: python tests/tools/check_encoding.py
      # Compose-static subset: no daemon needed (config validity, env
      # coverage, Tauri-not-in-Docker guard, Dockerfile gate).
      - run: python -m unittest tests.infra.test_compose.ComposeStaticTests -v

  infra-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - run: cp .env.example .env
      - run: docker compose build admin
      - run: docker compose up -d db mailpit greenmail admin
      - run: python -m unittest discover -s tests/infra -v
      # Live e2e (both suites skip — never fail — without services):
      # A9 admin flow (db+admin) + T-171 mail-flow vertical (greenmail).
      # The mail-flow leg shells out to its Rust test, hence cargo above.
      - run: python -m unittest discover -s infra/e2e -v
      - run: docker compose down -v
        if: always()
