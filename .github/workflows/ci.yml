# KIWI CI (T-140, Agent 6). Mirrors the local gates in docs/TESTING.md §2:
# Rust workspace (test/clippy/fmt) + kiwi-admin (ci/typecheck/test) +
# static checks (secret scan, fixtures, CSP, compose-static) + live infra
# (compose db+mailpit, admin image build, full unittest suite).
#
# What CI does NOT do: build Tauri bundles, run the desktop app, touch the
# sandbox (T-132), or require AI availability.

name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # System deps for compiling the Tauri workspace member (kiwi-app).
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  node-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiwi-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwi-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tests/tools/secret_scan.py
      - run: python tests/tools/check_fixtures.py
      - run: python tests/tools/check_csp.py
      # Compose-static subset: no daemon needed (config validity, env
      # coverage, Tauri-not-in-Docker guard, Dockerfile gate).
      - run: python -m unittest tests.infra.test_compose.ComposeStaticTests -v

  infra-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cp .env.example .env
      - run: docker compose up -d db mailpit greenmail
      - run: docker compose build admin
      - run: python -m unittest discover -s tests/infra -v
      - run: docker compose down -v
        if: always()
