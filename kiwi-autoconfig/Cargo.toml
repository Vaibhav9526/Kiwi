[package]
name = "kiwi-autoconfig"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI account autodiscovery: ISPDB-style fixture lookup, Thunderbird-style autoconfig XML fetch+parse, MX-derived heuristics, always falling back to manual entry. Offline-testable via trait + fixture XML."
publish = false

[dependencies]
kiwi-mail = { path = "../kiwi-mail" }
# OAuth2 token acquisition rides on the integrations HTTPS seam
# (docs/contracts/oauth2.md §6) — HTTPS-only, no redirects, bounded bodies.
kiwi-integrations = { path = "../kiwi-integrations" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
zeroize.workspace = true
base64.workspace = true
sha2.workspace = true
getrandom.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
