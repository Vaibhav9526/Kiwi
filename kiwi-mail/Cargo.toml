[package]
name = "kiwi-mail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI mail engine: native SMTP/IMAP/POP3 clients with full TLS security-parameter capture, account model, local mail store, and sync engine."
publish = false

# Dependency policy (prompt.md §15, docs/SECURITY.md):
#   * minimal, pinned, security-relevant crates only
#   * rustls (not native TLS) for deterministic, inspectable TLS configuration
#   * no unsafe code
[dependencies]
kiwi-core = { path = "../kiwi-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tracing.workspace = true
base64.workspace = true
mail-parser.workspace = true
rusqlite.workspace = true
async-trait.workspace = true
bytes.workspace = true
zeroize.workspace = true
md5 = "0.8"
time.workspace = true

[dev-dependencies]
rcgen = "0.13"
tokio-test = "0.4"

[lints]
workspace = true
