[package]
name = "kiwi-mail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI mail engine: native SMTP/IMAP/POP3 clients with full TLS security-parameter capture, account model, local mail store, and sync engine."
publish = false

# Dependency policy (prompt.md §15, docs/SECURITY.md):
#   * minimal, pinned, security-relevant crates only
#   * rustls (not native TLS) for deterministic, inspectable TLS configuration
#   * no unsafe code
[dependencies]
kiwi-core = { path = "../kiwi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tracing = "0.1"
base64 = "0.22"
mail-parser = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
bytes = "1"
x509-parser = "0.17"
sha2 = "0.10"
zeroize = "1"
md5 = "0.8"
time = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
