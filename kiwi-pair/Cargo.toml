[package]
name = "kiwi-pair"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI mobile-authenticator pairing engine: Ed25519 challenge issue/verify, persistent pairing record store, nonce+timestamp replay protection, device revocation, key fingerprints. Desktop side of contracts/authenticator.md."
