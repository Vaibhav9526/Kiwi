[package]
name = "kiwi-forensics"
version = "0.1.0"
edition = "2024"
description = "KIWI forensics engine: bounded PCAP ingest, mail-protocol analyzers, deterministic TLS/certificate/cipher rule engine and scoring. Works with no AI and no network access."
publish = false

# Dependency policy (prompt.md §15, docs/SECURITY.md):
#   * minimal, pinned, security-relevant crates only;
#   * no native/libpcap dependency (Windows-friendly, no C toolchain needed);
#   * capture-file parsing is implemented in-crate with hard bounds so that
#     untrusted PCAP bytes can never drive unbounded allocation.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# Integration seam tests only (T-166): the published crate stays
# serde-only. kiwi-mail drives a real client through a fixture-shaped
# local server; tokio + zeroize serve the test harness alone.
kiwi-mail = { path = "../kiwi-mail" }
tokio = { version = "1", features = ["full"] }
zeroize = "1"

[lints.rust]
# Security-sensitive parsing of untrusted input: no unsafe code anywhere.
unsafe_code = "forbid"
