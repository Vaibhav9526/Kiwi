[package]
name = "kiwi-mailauth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI domain-authentication checks: deterministic SPF/DKIM/DMARC evaluation with an offline-mockable DNS layer. No AI, no ambient clocks, no invented findings."
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = "3"
rand_core = "0.6"
hickory-resolver = { version = "0.26", features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "time", "net"] }

[lints]
workspace = true
