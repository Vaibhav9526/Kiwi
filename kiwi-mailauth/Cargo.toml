[package]
name = "kiwi-mailauth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI domain-authentication checks: deterministic SPF/DKIM/DMARC evaluation with an offline-mockable DNS layer. No AI, no ambient clocks, no invented findings."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = "3"
rand_core = "0.6"
hickory-resolver = { version = "0.26", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "net"] }

[lints]
workspace = true
