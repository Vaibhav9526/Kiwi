[package]
name = "kiwi-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "KIWI attachment sandbox: provider-pluggable disposable-VM analysis boundary (ADR-008). WSL2 interim tier + NullProvider; QEMU/WHPX is the dedicated-kernel target. Never executes hostile content on the host."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "time", "io-util", "rt-multi-thread"] }
async-trait = "0.1"

[lints]
workspace = true
